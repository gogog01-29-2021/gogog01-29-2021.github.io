# -----------------------------------------------------------------------------
# Blog topic taxonomy  (GENERATED — do not hand-maintain as the source of truth)
# -----------------------------------------------------------------------------
# This file is a serialized snapshot of the LLM-derived ontology. It is
# regenerated from the corpus of posts + their concepts by the agent-driven
# classification engine (see LOCKED_WORKFLOW.md §4). Depth is arbitrary:
# `children:` may nest to any level (upper concepts / lower concepts).
#
# RULES enforced by scripts/check-workflow.sh:
# - Every slug a post declares in `categories:` must appear somewhere in this tree.
# - Leaf slugs are STABLE: they drive /blog/category/<slug>/ URLs and are never
#   renamed by a regeneration (only regrouped under new upper-concept nodes).
#
# ROLL-UP: a post is registered under every slug it lists. To make an upper
# concept browsable, the post declares the full ancestor path, e.g.
#   categories: [math, analysis, complex-analysis]
# A category page becomes browsable once at least one post uses its slug.
# -----------------------------------------------------------------------------

- name: LLM
  slug: llm
  children:
    - name: AI Agents
      slug: ai-agents

- name: Math
  slug: math
  children:
    - name: Analysis
      slug: analysis
      children:
        - name: Calculus
          slug: calculus
        - name: Complex Analysis
          slug: complex-analysis
        - name: Differential Equations
          slug: differential-equations
    - name: Algebra & Foundations
      slug: algebra-foundations
      children:
        - name: Linear Algebra
          slug: linear-algebra
        - name: Set Theory
          slug: set-theory
    - name: Geometry & Topology
      slug: geometry-topology
      children:
        - name: Topology
          slug: topology
    - name: Probability & Finance
      slug: probability-finance
      children:
        - name: Probability & Stochastic Processes
          slug: probability
        - name: Finance
          slug: finance

- name: Physics
  slug: physics
  children: []

- name: Reading
  slug: reading
  children:
